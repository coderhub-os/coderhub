<header class="site-header" id="top">
  <div class="container site-header__inner">
    <a class="brand" href="{{HOME_HREF}}"><span class="brand__mark" aria-hidden="true">{{INITIALS}}</span><span class="brand__name">{{BRAND}}</span></a>
    <nav class="site-nav" aria-label="{{NAV_LABEL}}"><ul class="site-nav__list">{{NAV}}</ul></nav>
    <div class="site-header__tools">
      <nav class="lang-nav" aria-label="{{LANG_LABEL}}">{{LANGS}}</nav>
      <button class="mode-toggle" type="button" data-mode-toggle aria-pressed="false" aria-label="{{TOGGLE_LABEL}}" title="{{TOGGLE_LABEL}}"><span class="mode-toggle__icon mode-toggle__icon--sun">{{ICON_SUN}}</span><span class="mode-toggle__icon mode-toggle__icon--moon">{{ICON_MOON}}</span></button>
    </div>
  </div>
</header>
