<section class="hero" aria-labelledby="hero-name">

    <div class="hero__media">{{AVATAR}}</div>
    <div class="hero__body">
      <p class="eyebrow hero__eyebrow">{{EYEBROW}}</p>

      <ul class="links links--hero">{{LINKS}}</ul>
      <div class="hero__actions">{{CV_BUTTON}}</div>
    </div>
  </div>
</section>
